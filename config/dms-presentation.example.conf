# DMS presentation configuration, schema 1. Omitted settings use safe defaults.
schema_version=1

display.enabled=true
display.show_video=true
display.show_face_box=true
display.show_eye_boxes=true
display.show_mouth_box=true
display.show_landmarks=false
display.show_quality=true
display.show_calibration=true
display.show_presence=true
display.show_eye_openness=true
display.show_perclos=true
display.show_blink_counts=true
display.show_yawn_counts=true
display.show_pose=true
display.show_gaze=true
display.show_drowsiness=true
display.show_performance=true

# Normalized full-frame coordinates. This block has no effect while disabled.
processing_roi.enabled=false
processing_roi.x=0.0
processing_roi.y=0.0
processing_roi.width=1.0
processing_roi.height=1.0
processing_roi.minimum_face_coverage=0.80

statistics.reset_on_confirmed_driver_change=true
statistics.reset_on_session_start=true
statistics.rolling_window_seconds=300
statistics.minimum_known_coverage=0.80
statistics.cumulative_enabled=true
statistics.rolling_enabled=true
